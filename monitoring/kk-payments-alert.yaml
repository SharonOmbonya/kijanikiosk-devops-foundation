apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kk-payments-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: kk-payments
      rules:
        - alert: KKPaymentsPodRestart
          expr: increase(kube_pod_container_status_restarts_total{namespace="kijani-staging", container="kk-payments"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "kk-payments pod restarted"
            description: "A kk-payments container in kijani-staging has restarted within the last 5 minutes."
