---
- name: Configure KijaniKiosk servers
  hosts: kijanikiosk
  become: true
  become_method: sudo

  handlers:

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true


    - name: Restart service
      ansible.builtin.systemd:
        name: "{{ service_name }}.service"
        state: restarted


    - name: Reload journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted


  tasks:

    # ==================================================
    # PHASE 1: PACKAGES
    # ==================================================

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600


    - name: Install required packages
      ansible.builtin.apt:
        name: 
        - acl
        - nginx
        - curl
        - unzip
        - logrotate

        state: present
       



    # ==================================================
    # PHASE 2: SERVICE ACCOUNTS
    # ==================================================

    - name: Create kijanikiosk system group
      ansible.builtin.group:
        name: "{{ service_group }}"
        state: present


    - name: Create service account
      ansible.builtin.user:
        name: "{{ item }}"
        system: true
        create_home: false
        home: /nonexistent
        shell: /usr/sbin/nologin
        groups: "{{ service_group }}"
        append: true
        state: present
      loop: "{{ service_accounts }}" 


    # ==================================================
    # PHASE 3: DIRECTORY STRUCTURE
    # ==================================================

    - name: Create application directory tree
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop: "{{ kijanikiosk_directories }}"

    - name: Deploy payments environment file
      ansible.builtin.template:
        src: templates/payments-api.env.j2
        dest: "{{ config_dir }}/payments-api.env"
        owner: root
        group: "{{ service_group }}"
        mode: "0640"
    # ==================================================
    # PHASE 4: SYSTEMD UNIT FILE
    # ==================================================

    - name: Deploy systemd unit file
      ansible.builtin.template:
        src: templates/service.unit.j2
        dest: "/etc/systemd/system/{{ service_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart service



    - name: Enable and start service
      ansible.builtin.systemd:
        name: "{{ service_name }}.service"
        enabled: true
        state: started
        daemon_reload: true



    # ==================================================
    # PHASE 5: FIREWALL
    # ==================================================

    - name: Set ufw default deny incoming
      community.general.ufw:
        state: enabled
        default: deny
        direction: incoming


    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: 22
        proto: tcp


    - name: Allow service port on loopback only
      community.general.ufw:
        rule: allow
        port: 22
        interface: lo
        direction: in



        # ==================================================
    # PHASE 6: JOURNAL PERSISTENCE
    # ==================================================

    - name: Create persistent journal directory
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        mode: "0755"
      notify:
        - Reload journald

    - name: Create journald configuration directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy journald configuration
      ansible.builtin.template:
        src: templates/journald.conf.j2
        dest: /etc/systemd/journald.conf.d/kijanikiosk.conf
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload journald
    # ==================================================
    # PHASE 7: LOGROTATE
    # ==================================================

    - name: Deploy logrotate configuration
      ansible.builtin.template:
        src: templates/logrotate.j2
        dest: /etc/logrotate.d/kijanikiosk
        owner: root
        group: root
        mode: "0644"